apiVersion: batch/v1
kind: CronJob
metadata:
  name: fdic-incremental
  namespace: default
spec:
  schedule: "0 6 * * *"
  timeZone: Etc/UTC
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 3600
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 3600
      template:
        spec:
          serviceAccountName: fdic-pipeline
          restartPolicy: Never
          containers:
            - name: fdic-pipeline
              image: ACCOUNT_ID.dkr.ecr.us-east-2.amazonaws.com/fdic-pipeline:TAG
              imagePullPolicy: IfNotPresent
              args: ["--mode", "incremental"]
              env:
                - name: AWS_REGION
                  value: us-east-2
                - name: DB_SECRET_ARN
                  value: "SECRET_ARN"
                - name: FDIC_PAGE_SIZE
                  value: "1000"
                - name: FDIC_OVERLAP_DAYS
                  value: "7"
                - name: LOG_LEVEL
                  value: INFO
              resources:
                requests:
                  cpu: 250m
                  memory: 512Mi
                limits:
                  cpu: "1"
                  memory: 2Gi
